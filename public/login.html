<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Ingresar | Bitácora</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/css/styles.css" />
    </head>

    <body>
        <nav class="navbar navbar-dark">
            <div class="container py-2">
                <a class="navbar-brand" href="/index.html">Bitácora</a>
            </div>
        </nav>
        <main class="container py-5">
            <div class="row">
                <div class="col-md-6 col-lg-5 mx-auto">
                    <p class="eyebrow">Bienvenido de vuelta</p>
                    <h1>Ingresar</h1>
                    <div class="form-panel mt-4">
                        <div class="alert d-none" data-alert></div>
                        <form id="login-form">
                            <label class="form-label" for="email"
                                >Correo electrónico</label
                            ><input
                                class="form-control mb-3"
                                type="email"
                                id="email"
                                required
                            /><label class="form-label" for="password"
                                >Contraseña</label
                            ><input
                                class="form-control mb-4"
                                type="password"
                                id="password"
                                required
                            /><button
                                class="btn btn-accent w-100"
                                type="submit"
                            >
                                Ingresar
                            </button>
                        </form>
                        <p class="mt-4 mb-0 text-secondary">
                            ¿No tienes cuenta?
                            <a href="/registro.html">Regístrate</a>
                        </p>
                    </div>
                </div>
            </div>
        </main>
        <script type="module">
            import { apiFetch, setToken, showAlert } from "/js/app.js";
            document
                .querySelector("#login-form")
                .addEventListener("submit", async (event) => {
                    event.preventDefault();
                    try {
                        const data = await apiFetch("/auth/login", {
                            method: "POST",
                            body: JSON.stringify({
                                email: email.value,
                                password: password.value,
                            }),
                        });
                        setToken(data.token);
                        location.href = "/index.html";
                    } catch (error) {
                        showAlert(error.message);
                    }
                });
        </script>
    </body>
</html>
