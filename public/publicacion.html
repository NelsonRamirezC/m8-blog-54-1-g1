<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publicación | Bitácora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <nav class="navbar navbar-dark">
        <div class="container py-2"><a class="navbar-brand" href="/index.html">Bitácora</a>
            <div class="ms-auto d-flex gap-3 align-items-center"><a class="btn btn-sm btn-outline-light"
                    href="/login.html" data-guest>Ingresar</a><a class="btn btn-sm btn-accent d-none"
                    href="/perfil.html" data-auth>Mi perfil</a><button class="btn btn-sm btn-link text-white d-none"
                    data-auth data-logout>Salir</button></div>
        </div>
    </nav>
    <main class="container py-5"><a href="/index.html" class="text-decoration-none text-secondary">← Volver a
            publicaciones</a>
        <div id="post" class="mt-4"></div>
        <div class="row mt-5">
            <section class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h4 mb-0">Comentarios <span id="comment-count" class="text-secondary"></span></h2>
                </div>
                <div class="form-panel mb-4 d-none" data-auth>
                    <form id="comment-form"><label class="form-label" for="comment">Comparte tu opinión</label><textarea
                            class="form-control mb-3" id="comment" rows="3" required maxlength="2000"></textarea><button
                            class="btn btn-accent" type="submit">Comentar</button></form>
                </div>
                <div class="alert d-none" data-alert></div>
                <div id="comments"></div>
            </section>
        </div>
    </main>
    <script type="module">
        import { apiFetch, canManage, escapeHtml, formatDate, getUser, setupNav, showAlert } from "/js/app.js";
        setupNav(); const id = new URLSearchParams(location.search).get("id"); const user = getUser();
        if (!id) location.href = "/index.html";
        const load = async () => { const { publicacion } = await apiFetch(`/api/publicaciones/${id}`); const comments = publicacion.comentarios || []; document.title = `${publicacion.titulo} | Bitácora`; document.querySelector("#post").innerHTML = `<p class="eyebrow">${escapeHtml(publicacion.usuario?.nombre || "Autor")}</p><h1 class="display-4">${escapeHtml(publicacion.titulo)}</h1><p class="meta">Publicado ${formatDate(publicacion.fechaCreacion)} · ${comments.length} comentario${comments.length === 1 ? "" : "s"}</p><div class="fs-5 lh-lg mt-4" style="white-space: pre-wrap">${escapeHtml(publicacion.contenido)}</div>${canManage(user, publicacion.usuarioId) ? `<button class="btn btn-outline-danger btn-sm mt-4" id="delete-post">Eliminar publicación</button>` : ""}`; document.querySelector("#comment-count").textContent = `(${comments.length})`; document.querySelector("#comments").innerHTML = comments.length ? comments.map((comment) => `<article class="comment mb-4"><div class="d-flex justify-content-between"><strong>${escapeHtml(comment.usuario?.nombre || "Usuario")}</strong><span class="meta">${formatDate(comment.fechaCreacion)}</span></div><p class="mb-1 mt-2" style="white-space: pre-wrap">${escapeHtml(comment.contenido)}</p>${canManage(user, comment.usuarioId) || canManage(user, publicacion.usuarioId) ? `<button class="btn btn-link text-danger btn-sm p-0 delete-comment" data-id="${comment.id}">Eliminar</button>` : ""}</article>`).join("") : '<p class="text-secondary">Sé la primera persona en comentar.</p>'; document.querySelectorAll(".delete-comment").forEach((button) => button.addEventListener("click", async () => { if (!confirm("¿Eliminar este comentario?")) return; try { await apiFetch(`/api/comentarios/${button.dataset.id}`, { method: "DELETE" }); await load(); } catch (error) { showAlert(error.message); } })); document.querySelector("#delete-post")?.addEventListener("click", async () => { if (!confirm("¿Eliminar esta publicación?")) return; try { await apiFetch(`/api/publicaciones/${id}`, { method: "DELETE" }); location.href = "/index.html"; } catch (error) { showAlert(error.message); } }); };
        try { await load(); } catch (error) { showAlert(error.message); }
        document.querySelector("#comment-form")?.addEventListener("submit", async (event) => { event.preventDefault(); try { await apiFetch("/api/comentarios", { method: "POST", body: JSON.stringify({ contenido: document.querySelector("#comment").value, publicacionId: id }) }); event.target.reset(); await load(); } catch (error) { showAlert(error.message); } });
    </script>
</body>

</html>
