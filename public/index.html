<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bitácora | Publicaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container py-2">
            <a class="navbar-brand" href="/index.html">Bitácora</a>
            <div class="ms-auto d-flex align-items-center gap-3"><span class="text-white-50 small d-none d-md-inline"
                    data-auth>Hola, <span data-user-name></span></span>
                <a class="btn btn-sm btn-outline-light" href="/login.html" data-guest>Ingresar</a><a
                    class="btn btn-sm btn-accent d-none" href="/perfil.html" data-auth>Mi perfil</a>
                <button class="btn btn-sm btn-link text-white d-none" data-auth data-logout>Salir</button>
            </div>
        </div>
    </nav>
    <header class="hero">
        <div class="container">
            <p class="eyebrow">Ideas que permanecen</p>
            <h1>Historias, preguntas y hallazgos.</h1>
            <p class="lead mt-4 mb-0 text-white-50">Un espacio para compartir lo que estamos aprendiendo.</p>
        </div>
    </header>
    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <p class="eyebrow mb-1">Últimas entradas</p>
                <h2 class="mb-0">Publicaciones</h2>
            </div><a href="/crear-publicacion.html" class="btn btn-accent d-none" data-auth>+ Nueva publicación</a>
        </div>
        <div class="alert d-none" data-alert></div>
        <div id="posts" class="row g-4">
            <div class="col-12 text-secondary">Cargando publicaciones...</div>
        </div>
    </main>
    <footer class="container py-4 border-top"><small>Bitácora · Comunidad de aprendizaje</small></footer>
    <script type="module">
        import { apiFetch, escapeHtml, formatDate, setupNav, showAlert } from "/js/app.js";
        setupNav();
        try {
            const { publicaciones } = await apiFetch("/api/publicaciones");
            document.querySelector("#posts").innerHTML = publicaciones.length ? publicaciones.map((post) => `<div class="col-md-6 col-xl-4"><article class="post-card"><a href="/publicacion.html?id=${post.id}"><div class="post-body"><p class="eyebrow">${escapeHtml(post.usuario?.nombre || "Autor")}</p><h2>${escapeHtml(post.titulo)}</h2><p class="text-secondary">${escapeHtml(post.contenido).slice(0, 180)}${post.contenido.length > 180 ? "..." : ""}</p><p class="meta mb-0">${formatDate(post.fechaCreacion)} · Leer publicación →</p></div></a></article></div>`).join("") : '<div class="col-12"><p class="text-secondary">Todavía no hay publicaciones.</p></div>';
        } catch (error) { showAlert(error.message); document.querySelector("#posts").innerHTML = ""; }
    </script>
</body>

</html>
