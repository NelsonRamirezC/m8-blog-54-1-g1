<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Crear cuenta | Bitácora</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/css/styles.css" />
    </head>

    <body>
        <nav class="navbar navbar-dark">
            <div class="container py-2">
                <a class="navbar-brand" href="/index.html">Bitácora</a>
            </div>
        </nav>
        <main class="container py-5">
            <div class="row">
                <div class="col-md-7 col-lg-6 mx-auto">
                    <p class="eyebrow">Únete a la conversación</p>
                    <h1>Crear cuenta</h1>
                    <div class="form-panel mt-4">
                        <div class="alert d-none" data-alert></div>
                        <form id="register-form" enctype="multipart/form-data">
                            <label class="form-label" for="name">Nombre</label
                            ><input
                                class="form-control mb-3"
                                id="name"
                                required
                                maxlength="100"
                            /><label class="form-label" for="email"
                                >Correo electrónico</label
                            ><input
                                class="form-control mb-3"
                                type="email"
                                id="email"
                                required
                            /><label class="form-label" for="password"
                                >Contraseña</label
                            ><input
                                class="form-control mb-3"
                                type="password"
                                id="password"
                                required
                                minlength="6"
                            /><label class="form-label" for="avatar"
                                >Avatar (opcional)</label
                            ><input
                                class="form-control mb-4"
                                type="file"
                                id="avatar"
                                accept="image/jpeg,image/jpg,image/webp"
                            /><button
                                class="btn btn-accent w-100"
                                type="submit"
                            >
                                Registrarme
                            </button>
                        </form>
                        <p class="mt-4 mb-0 text-secondary">
                            ¿Ya tienes cuenta? <a href="/login.html">Ingresa</a>
                        </p>
                    </div>
                </div>
            </div>
        </main>
        <script type="module">
            import { apiFetch, showAlert } from "/js/app.js";
            document
                .querySelector("#register-form")
                .addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const formData = new FormData();
                    formData.append("nombre", name.value);
                    formData.append("email", email.value);
                    formData.append("password", password.value);
                    if (avatar.files[0])
                        formData.append("avatar", avatar.files[0]);
                    try {
                        await apiFetch("/auth/registro", {
                            method: "POST",
                            body: formData,
                        });
                        location.href = "/login.html";
                    } catch (error) {
                        showAlert(error.message);
                    }
                });
        </script>
    </body>
</html>
