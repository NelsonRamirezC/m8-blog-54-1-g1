<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Nueva publicación | Bitácora</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/css/styles.css" />
    </head>

    <body>
        <nav class="navbar navbar-dark">
            <div class="container py-2">
                <a class="navbar-brand" href="/index.html">Bitácora</a
                ><a class="btn btn-sm btn-outline-light" href="/index.html"
                    >Cancelar</a
                >
            </div>
        </nav>
        <main class="container py-5">
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <p class="eyebrow">Escribir</p>
                    <h1>Nueva publicación</h1>
                    <div class="form-panel mt-4">
                        <div class="alert d-none" data-alert></div>
                        <form id="post-form">
                            <label class="form-label" for="title">Título</label
                            ><input
                                class="form-control mb-3"
                                id="title"
                                required
                                maxlength="255"
                            /><label class="form-label" for="content"
                                >Contenido</label
                            ><textarea
                                class="form-control mb-4"
                                id="content"
                                rows="10"
                                required
                            ></textarea
                            ><button class="btn btn-accent" type="submit">
                                Publicar
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <script type="module">
            import { apiFetch, getUser, showAlert } from "/js/app.js";
            if (!getUser()) location.href = "/login.html";
            document
                .querySelector("#post-form")
                .addEventListener("submit", async (event) => {
                    event.preventDefault();
                    try {
                        const { publicacion } = await apiFetch(
                            "/api/publicaciones",
                            {
                                method: "POST",
                                body: JSON.stringify({
                                    titulo: title.value,
                                    contenido: content.value,
                                }),
                            },
                        );
                        location.href = `/publicacion.html?id=${publicacion.id}`;
                    } catch (error) {
                        showAlert(error.message);
                    }
                });
        </script>
    </body>
</html>
