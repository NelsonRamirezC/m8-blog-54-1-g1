<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil | Bitácora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <nav class="navbar navbar-dark">
        <div class="container py-2"><a class="navbar-brand" href="/index.html">Bitácora</a><button
                class="btn btn-sm btn-link text-white" data-logout>Salir</button></div>
    </nav>
    <main class="container py-5">
        <div class="row">
            <div class="col-lg-7 mx-auto">
                <p class="eyebrow">Tu cuenta</p>
                <h1>Mi perfil</h1>
                <div class="form-panel mt-4">
                    <div class="alert d-none" data-alert></div>
                    <div id="profile-info" class="mb-4 text-secondary"></div>
                    <form id="profile-form"><label class="form-label" for="name">Nombre</label><input
                            class="form-control mb-3" id="name" required maxlength="100"><label class="form-label"
                            for="email">Correo electrónico</label><input class="form-control mb-3" type="email"
                            id="email" required><label class="form-label" for="password">Contraseña nueva</label><input
                            class="form-control mb-4" type="password" id="password" required minlength="6"><button
                            class="btn btn-accent" type="submit">Guardar cambios</button></form>
                    <hr class="my-4"><button id="delete-account" class="btn btn-outline-danger">Eliminar mi
                        cuenta</button>
                </div>
            </div>
        </div>
    </main>
    <script type="module">
        import { apiFetch, getUser, logout, showAlert } from "/js/app.js";

        const user = getUser();
        if (!user) {
            location.href = "/login.html";
            throw new Error("Sesión requerida");
        }

        const nameInput = document.querySelector("#name");
        const emailInput = document.querySelector("#email");
        const passwordInput = document.querySelector("#password");

        try {
            const { usuario: current } = await apiFetch(`/api/usuarios/${user.id}`);
            nameInput.value = current.nombre;
            emailInput.value = current.email;
            document.querySelector("#profile-info").textContent =
                `Cuenta creada el ${new Date(current.fechaCreacion).toLocaleDateString("es-CL")}`;
        } catch (error) {
            showAlert(error.message);
        }

        document.querySelector("#profile-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            try {
                await apiFetch(`/api/usuarios/${user.id}`, {
                    method: "PUT",
                    body: JSON.stringify({
                        nombre: nameInput.value,
                        email: emailInput.value,
                        password: passwordInput.value,
                    }),
                });
                passwordInput.value = "";
                showAlert("Datos actualizados correctamente.", "success");
            } catch (error) {
                showAlert(error.message);
            }
        });

        document.querySelector("#delete-account").addEventListener("click", async () => {
            if (!confirm("¿Seguro que quieres eliminar tu cuenta?")) return;
            try {
                await apiFetch(`/api/usuarios/${user.id}`, { method: "DELETE" });
                logout();
            } catch (error) {
                showAlert(error.message);
            }
        });
    </script>
</body>

</html>
